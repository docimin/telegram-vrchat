services:
  bot:
    build: .
    env_file: .env
    environment:
      DATA_DIR: /data
      DIST_DIR: /app/dist
    volumes:
      - bot-data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    restart: unless-stopped

volumes:
  bot-data:
  caddy-data:
